[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:qq]
command=/usr/bin/xvfb-run -a /opt/qq/opt/QQ/qq --no-sandbox --disable-gpu
directory=/opt/qq/opt/QQ
environment=HOME="/AstrBot/data/napcat/home"
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:astrbot]
command=python main.py
directory=/AstrBot
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

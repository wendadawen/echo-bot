[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:qq]
command=/usr/bin/env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy -u BOT_API_KEY -u BOT_API_BASE -u BOT_SEARCH_API_KEY -u BOT_SEARCH_API_BASE /usr/bin/xvfb-run -a /opt/qq/opt/QQ/qq --no-sandbox --disable-gpu
directory=/opt/qq/opt/QQ
environment=HOME="/AstrBot/data/napcat/home"
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:astrbot]
command=python main.py
directory=/AstrBot
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

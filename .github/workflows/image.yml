name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 发布前门禁自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行校验、编译、单测与模拟
        run: |
          python tools/validate_plugin.py
          python -m compileall -q plugin tests tools
          python -m unittest discover -s tests -p "test_*.py" -v
          python tools/simulate.py
          docker compose config -q
          bash -n scripts/*.sh docker/*.sh

  build:
    name: 构建并推送双架构镜像
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备多架构构建
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查国内镜像加速仓配置
        id: mirror
        env:
          MIRROR_IMAGE: ${{ vars.MIRROR_IMAGE }}
          MIRROR_REGISTRY: ${{ vars.MIRROR_REGISTRY }}
          MIRROR_USERNAME: ${{ secrets.MIRROR_USERNAME }}
          MIRROR_PASSWORD: ${{ secrets.MIRROR_PASSWORD }}
        run: |
          mirror_image="$(printf '%s' "${MIRROR_IMAGE:-}" | tr -d '[:space:]')"
          mirror_registry="$(printf '%s' "${MIRROR_REGISTRY:-}" | tr -d '[:space:]')"
          if [ -n "$mirror_image" ] && [ -n "${MIRROR_USERNAME:-}" ] && [ -n "${MIRROR_PASSWORD:-}" ]; then
            last_seg="${mirror_image##*/}"
            if [ "${last_seg#*:}" != "$last_seg" ]; then
              mirror_image="${mirror_image%:"${last_seg#*:}"}"
            fi
            if [ -z "$mirror_registry" ]; then
              mirror_registry="${mirror_image%%/*}"
            fi
            {
              echo "enabled=true"
              echo "registry=${mirror_registry}"
              echo "images<<EOF"
              echo "ghcr.io/${GITHUB_REPOSITORY}"
              echo "${mirror_image}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "enabled=false"
              echo "registry="
              echo "images=ghcr.io/${GITHUB_REPOSITORY}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: 登录镜像加速仓（可选）
        if: steps.mirror.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.mirror.outputs.registry }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.mirror.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

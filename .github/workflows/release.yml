name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验插件结构与编译
        run: |
          python tools/validate_plugin.py
          python -m compileall -q plugin tests tools
      - name: 运行单元测试、离线模拟与版本一致性检查
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python tools/simulate.py
          python - <<'PY'
          import os, re, sys
          from pathlib import Path
          tag = os.environ["TAG_NAME"].strip()
          text = Path("plugin/astrbot_plugin_echo/metadata.yaml").read_text(encoding="utf-8")
          m = re.search(r"^version:\s*(\S+)", text, re.M)
          ver = m.group(1) if m else ""
          if ver.lstrip("v") != tag.lstrip("v"):
              sys.exit(f"metadata.yaml version ({ver}) != git tag ({tag})")
          PY
      - name: 安装框架并验证插件可初始化
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astrbot==4.29.4"
          python tools/smoke_import.py
      - name: 打包插件
        run: python tools/package_plugin.py
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: 核心逻辑自检 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 校验插件结构
        run: python tools/validate_plugin.py
      - name: 语法检查
        run: python -m compileall -q plugin tests tools
      - name: 核心逻辑单测
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 离线模拟器冒烟
        run: python tools/simulate.py

  build-plugin:
    name: 安装 AstrBot 并构建插件
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装框架并验证插件可加载
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astrbot==4.29.4"
          python tools/smoke_import.py
      - name: 打包插件
        run: python tools/package_plugin.py
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: astrbot_plugin_echo
          path: dist/*.zip
          if-no-files-found: error

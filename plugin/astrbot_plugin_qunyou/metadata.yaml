name: astrbot_plugin_qunyou
display_name: 群友
short_desc: 按群记梗、定时提醒、偶尔接话的中文群聊机器人。
desc: 一个轻量的 AstrBot 中文群聊插件。按群隔离地记住外号与梗，支持 @ 唤醒、概率接话和定时提醒；模型可接任意 OpenAI 兼容接口，不填凭据时使用本地模拟回复。
version: v0.1.0
author: wendadawen
repo: https://github.com/wendadawen/qun-bot
astrbot_version: ">=4.29.4,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - wecom
  - discord

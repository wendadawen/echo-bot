# 一个容器跑整套，所有持久化数据放在 Docker 命名卷（不挂载宿主机目录）。
services:
  astrbot:
    image: ${BOT_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/wendadawen/echo-bot:latest}
    container_name: ${CONTAINER_NAME:-echo-bot}
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT:-4g}
    pids_limit: ${PIDS_LIMIT:-512}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ONEBOT_TOKEN: ${ONEBOT_TOKEN:-}
      NAPCAT_WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}
      BOT_QQ: ${BOT_QQ:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      BOT_API_BASE: ${BOT_API_BASE:-}
      BOT_MODEL: ${BOT_MODEL:-}
      BOT_HISTORY_LIMIT: ${BOT_HISTORY_LIMIT:-}
      BOT_TASK_TIMEOUT: ${BOT_TASK_TIMEOUT:-}
      BOT_SEARCH_PROVIDER: ${BOT_SEARCH_PROVIDER:-}
      BOT_SEARCH_API_BASE: ${BOT_SEARCH_API_BASE:-}
      BOT_SEARCH_API_KEY: ${BOT_SEARCH_API_KEY:-}
      QQ_DEB_AMD64: ${QQ_DEB_AMD64:-}
      QQ_DEB_ARM64: ${QQ_DEB_ARM64:-}
      QQ_DEB_SHA256: ${QQ_DEB_SHA256:-}
      NAPCAT_ZIP_URL: ${NAPCAT_ZIP_URL:-}
      NAPCAT_ZIP_SHA256: ${NAPCAT_ZIP_SHA256:-}
      LINK_RESOLVER_REF: ${LINK_RESOLVER_REF:-}
      LINK_RESOLVER_URL: ${LINK_RESOLVER_URL:-}
      LINK_RESOLVER_SHA256: ${LINK_RESOLVER_SHA256:-}
      GITHUB_PROXY: ${GITHUB_PROXY:-}
      KEEP_BOOTSTRAP_CACHE: ${KEEP_BOOTSTRAP_CACHE:-0}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PANEL_PORT:-6185}:6185" # AstrBot 面板
      - "${BIND_HOST:-127.0.0.1}:${NAPCAT_PORT:-6099}:6099" # 扫码登录页
    volumes:
      - echo_bot_data:/AstrBot/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:6185/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  echo_bot_data:
